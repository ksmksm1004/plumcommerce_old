version: 0.0
os: linux
files:
  - source: /
    destination: /opt/plumcommerce
file_exists_behavior: OVERWRITE
permissions:
  - object: /opt/plumcommerce
    pattern: "**"
    owner: ec2-user
    group: ec2-user
hooks:
  BeforeInstall:
    - location: scripts/codedeploy_stop.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/codedeploy_install.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/codedeploy_start.sh
      timeout: 120
      runas: root
  ValidateService:
    - location: scripts/codedeploy_validate.sh
      timeout: 60
      runas: root
